[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc-engine"
version = "0.1.0"
description = "A fully functional MCMC sampling library built from scratch — numpy only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["mcmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

